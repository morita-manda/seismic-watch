<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>SEISMIC WATCH — 公開終了</title>
<style>
body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:#060c14; color:#ddeeff; font-family:'Noto Sans JP', sans-serif; text-align:center; }
main { padding:32px; }
h1 { font-size:1.2rem; color:#00d4ff; }
p { color:#5a7a90; font-size:.85rem; line-height:1.8; }
a { color:#00d4ff; }
</style>
</head>
<body>
<main>
  <h1>SEISMIC WATCH は公開を終了しました</h1>
  <p>ご利用ありがとうございました。<br>
  地震・津波情報は <a href="https://www.jma.go.jp/bosai/map.html">気象庁の防災情報ページ</a> をご確認ください。<br>
  ホーム画面に追加済みのアプリは削除してください。</p>
</main>
<script>
// 旧Service Workerとキャッシュを破棄する
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
}
if (window.caches) {
  caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
}
</script>
</body>
</html>
